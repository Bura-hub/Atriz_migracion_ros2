# /etc/systemd/journald.conf.d/zz-atriz.conf
#
# Lo instala fase_1_higiene_so.sh (paso 3/9), y por tanto provision.sh y la
# imagen dorada. Está versionado en scripts/sistema/ —y no escrito con un
# heredoc— para que verificar_robot.sh sección 13 pueda detectar su deriva con
# un `cmp`. Criterio A de scripts/sistema/README.md.
#
# ═══════════════════════════════════════════════════════════════════════════
# 🔴🔴 EL NOMBRE EMPIEZA POR `zz-` A PROPÓSITO. `99-` PERDERÍA.
# ═══════════════════════════════════════════════════════════════════════════
# systemd ordena TODOS los drop-ins por nombre de FICHERO, sin importar si
# vienen de /etc o de /usr. El de Ubuntu se llama `syslog.conf`, así que un
# `99-atriz.conf` ordenaría ANTES ('9' < 's') y su ForwardToSyslog=no lo
# pisaría el `yes` de Ubuntu: el fichero puesto y sin efecto.
#
# Se comprueba con el ÚLTIMO valor, no con que el fichero exista:
#   systemd-analyze cat-config systemd/journald.conf | grep '^ForwardToSyslog=' | tail -1
#
# ═══════════════════════════════════════════════════════════════════════════
# Por qué 256M, medido en rvr-01 el 2026-08-15
# ═══════════════════════════════════════════════════════════════════════════
# Aquí había `SystemMaxUse=32M`, puesto por una razón buena y medida: 784 MB de
# journal sin límite daban 47 s de bloqueo por I/O en 42 min de reposo. Pero:
#
#   registro más antiguo   2026-08-14T19:29:56   -> RETENCIÓN 23 h 08 min
#   journal                35,7 MB               -> ~37 MB/día
#
# 23 horas no cubren un incidente de fin de semana, y se comió la evidencia del
# único fallo que se ha querido investigar de verdad. A ~37 MB/día, 256M son
# ~7 días. NO cuesta más escrituras: el ritmo lo fijan los servicios, no el
# tope. Cuesta ESPACIO, y en rvr-01 había 20 GB libres.
#
# ⚠️ La retención es `SystemMaxUse ÷ ritmo`, así que NO está garantizada: una
#    inundación como la del ydlidar (2,17 millones de líneas/día) la hundiría.
#    Es 8× más margen, no una promesa.
#
# 🔴 Y `MaxRetentionSec` NO se pone, aunque parezca lo natural — TRASPASO.md
#    llegó a decir que era lo que «garantiza retención», y es AL REVÉS:
#    `MaxRetentionSec` es una edad MÁXIMA y `SystemMaxFiles` un número máximo de
#    ficheros. Los dos sólo pueden RECORTAR. Ponerlos aquí tiraría días que
#    caben.
#
# ⚠️ ForwardToSyslog=no NO BASTA por sí solo: rsyslog carga además `imklog`, que
#    lee el anillo del kernel sin pasar por journald. Por eso fase_1 además
#    PARA el servicio. Medido con control el 2026-08-15, evidencia 122.

[Journal]
# Sin esto cada línea se escribe DOS veces: el journal y /var/log/syslog.
# Ubuntu lo activa en /usr/lib/systemd/journald.conf.d/syslog.conf, deshaciendo
# el defecto de systemd. Medido: /var/log en 106 MB contra un tope de 32M.
ForwardToSyslog=no

# ~7 días al ritmo medido. Ver arriba.
SystemMaxUse=256M

# El journal volátil de /run, que vive en RAM. La Pi 4 tiene 4 GB y el stack
# completo usa ~477 MB; 16M es holgado y acota el peor caso.
RuntimeMaxUse=16M
